[package]
name = "claude-sync-ui"
version = "0.2.6"
description = "Desktop GUI for claude-sync — sync ~/.claude across machines"
authors = ["ssallem"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ssallem/claude-sync-ui"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "claude_sync_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.3.5"
# Device Flow OAuth — native-tls (Windows SChannel) avoids the OpenSSL build hassle.
reqwest = { version = "0.12", features = ["json", "native-tls"], default-features = false }
# Secure token storage. v0.2.1 hotfix: keyring 3.x requires explicit backend
# features per-target — without them the crate silently uses a no-op store
# (set_password "succeeds" but persists nothing), which is what caused v0.2.0
# to drop the GitHub access_token after login. We enable the OS-native backend
# per target so the build stays minimal on each platform.
#   Windows -> windows-native (Credential Manager / DPAPI)
#   macOS   -> apple-native   (Keychain via security-framework)
#   Linux   -> linux-native-sync-persistent (kernel keyutils + secret-service)
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }
